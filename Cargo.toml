[package]
name = "sorosusu-contracts"
version = "0.1.0"
edition = "2021"
description = "Core logic for the VeriNode ROSCA protocol on Stellar"
license = "MIT"

[lib]
name = "sorosusu_contracts"
crate-type = ["cdylib", "rlib"] # Essential for WASM compilation and integration tests

[features]
testutils = []

[dependencies]
dlmalloc = { version = "0.2.14", features = ["global"] }
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
arbitrary = { version = "=1.4.2", features = ["derive"] }
proptest = "1.4"

[profile.release]
opt-level = "z"   # Optimize for small binary size
lto = true
codegen-units = 1

[[test]]
name = "griefing_resistance_test"
path = "tests/slashing/griefing_resistance_test.rs"

[[test]]
name = "bls_comprehensive_test"
path = "tests/bls_comprehensive_test.rs"

[[test]]
name = "dkg_serialization_roundtrip_test"
path = "tests/crypto/dkg_serialization_roundtrip_test.rs"

[[test]]
name = "proof_of_connectivity_epoch_nonce_test"
path = "tests/attestation/proof_of_connectivity_epoch_nonce_test.rs"

[[test]]
name = "backup_verification_test"
path = "tests/backup_verification_test.rs"

[[test]]
name = "webhook_delivery_test"
path = "tests/webhook_delivery_test.rs"

[[test]]
name = "kafka_consumer_lag_test"
path = "tests/kafka_consumer_lag_test.rs"

# ── Lint policy ──────────────────────────────────────────────────────────────
# Enforced via `cargo clippy -- -D warnings` in CI. The lints below are the
# style/pedantic ones we deliberately do not churn on:
#   - inconsistent_digit_grouping: cosmetic underscore placement in numeric
#     literals; rewriting them by hand in a value-carrying financial contract
#     risks typos, for no behavioural gain.
#   - needless_range_loop: several are in BLS/DKG crypto where the index is
#     load-bearing (indexing SIGMA, byte buffers); an iterator rewrite would
#     obscure intent and risk subtle bugs.
#   - too_many_arguments / type_complexity: inherent to the contract entrypoint
#     and consensus signatures; refactoring is a behavioural change, out of
#     scope for a formatting/lint pass.
#   - should_implement_trait: an intentional `mul` method name in the BLS math.
#   - ptr_arg / manual_checked_ops / explicit_counter_loop: the remaining sites
#     are in settlement (merkle `.clone()` semantics), governance vote math (the
#     guarded branch has side effects, not just a division), and migration
#     version-contiguity logic — the "fix" is a behavioural change, out of scope
#     for a formatting/lint pass and best done deliberately with its own tests.
[lints.clippy]
inconsistent_digit_grouping = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
ptr_arg = "allow"
manual_checked_ops = "allow"
explicit_counter_loop = "allow"
