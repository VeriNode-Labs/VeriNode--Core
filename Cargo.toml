[package]
name = "sorosusu-contracts"
version = "0.1.0"
edition = "2021"
description = "Core logic for the VeriNode ROSCA protocol on Stellar"
license = "MIT"

[lib]
name = "sorosusu_contracts"
crate-type = ["cdylib", "rlib"] # Essential for WASM compilation and integration tests

[features]
testutils = []

[dependencies]
dlmalloc = { version = "0.2.14", features = ["global"] }
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
arbitrary = { version = "=1.4.2", features = ["derive"] }
proptest = "1.4"

[profile.release]
opt-level = "z"   # Optimize for small binary size
lto = true
codegen-units = 1

[[test]]
name = "griefing_resistance_test"
path = "tests/slashing/griefing_resistance_test.rs"

[[test]]
name = "bls_comprehensive_test"
path = "tests/bls_comprehensive_test.rs"

[[test]]
name = "dkg_serialization_roundtrip_test"
path = "tests/crypto/dkg_serialization_roundtrip_test.rs"

[[test]]
name = "proof_of_connectivity_epoch_nonce_test"
path = "tests/attestation/proof_of_connectivity_epoch_nonce_test.rs"

[[test]]
name = "backup_verification_test"
path = "tests/backup_verification_test.rs"

[[test]]
name = "webhook_delivery_test"
path = "tests/webhook_delivery_test.rs"

[[test]]
name = "kafka_consumer_lag_test"
path = "tests/kafka_consumer_lag_test.rs"

[[test]]
name = "light_client_finality_skew_test"
path = "tests/light_client_finality_skew_test.rs"

[[test]]
name = "capacity_planning_divergence_test"
path = "tests/capacity_planning_divergence_test.rs"
