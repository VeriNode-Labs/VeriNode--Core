[graph]
targets = [
  { triple = "wasm32-unknown-unknown" },
  { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
  # curve25519-dalek timing side-channel in Scalar sub (RUSTSEC-2024-0344).
  # Transitive dep via soroban-sdk; not directly reachable from project code.
  # Patched in >=4.1.3; awaiting soroban-sdk upgrade.
  "RUSTSEC-2024-0344",
  # time crate stack-exhaustion DoS via RFC 2822 parsing (RUSTSEC-2026-0009).
  # Transitive dep via soroban-sdk; project never parses user-supplied RFC 2822.
  # Patched in >=0.3.47; awaiting soroban-sdk upgrade.
  "RUSTSEC-2026-0009",
  # keccak unsoundness in ARMv8 asm backend (RUSTSEC-2026-0012).
  # Transitive dep; asm feature is off by default and not enabled here.
  # Patched in >=0.1.6; awaiting soroban-sdk upgrade.
  "RUSTSEC-2026-0012",
  # rand unsoundness with custom logger + thread_rng (RUSTSEC-2026-0097).
  # Transitive dep via soroban-sdk; log + thread_rng feature combination
  # is not active in this project. Patched in >=0.8.6 / >=0.9.3.
  "RUSTSEC-2026-0097",
  # paste crate unmaintained (RUSTSEC-2024-0436).
  # Transitive dep via soroban-sdk; no security impact.
  "RUSTSEC-2024-0436",
]

[licenses]
unlicensed = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
