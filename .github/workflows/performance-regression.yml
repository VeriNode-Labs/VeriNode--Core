name: Performance Regression Detection CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CRITICAL_PATH_P99_TARGET_MS: 100
  AVAILABILITY_TARGET_BPS: 9999

jobs:
  performance-regression-check:
    name: Performance Regression & Canary Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Performance Regression Detection Integration Tests
        run: cargo test --test perf_regression_detection_test --verbose

      - name: Run CI Performance Regression Detection Analysis
        run: python3 scripts/detect_perf_regression.py
