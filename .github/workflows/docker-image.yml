name: Docker Image Build & Layer Cache CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cache warm-up run (Mondays at 03:17 UTC)
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_SCOPE: verinode-core-buildkit
  CACHE_MODE: max

jobs:
  docker-build:
    name: Build container image with BuildKit cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with BuildKit layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }},mode=${{ env.CACHE_MODE }}

      - name: Publish cache monitoring guidance
        run: |
          echo "### BuildKit Layer Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "Review the build logs for \`CACHED\` layer entries to verify cache hits." >> $GITHUB_STEP_SUMMARY

  canary-analysis:
    name: Canary analysis and container verification
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Dockerfile & dockerignore configuration
        run: |
          python3 scripts/validate_docker_cache.py
